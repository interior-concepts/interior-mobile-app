name: new_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rive: ^0.14.5
  http: ^1.6.0
  clerk_flutter: ^0.0.8-beta
  clerk_auth: ^0.0.8-beta
  file_picker: ^10.3.2
  wave: ^0.2.5
  flutter_spinkit: ^5.2.2
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.1.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  hugeicons: ^1.1.7
  fui_kit: 2.1.0
  skeletonizer: 2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon.png
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/images/checkbackground.jpg
    - assets/images/favicon-16x16.png
    - assets/mobileBanner3.jpeg

# No dependency_overrides required — use compatible rive package
